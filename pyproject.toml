[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vdl"
version = "0.1.0"
description = "Download video dari hampir semua situs (via yt-dlp)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Syqmhmmd", email = "you@example.com" },
]
keywords = ["video", "downloader", "youtube", "tiktok", "instagram", "yt-dlp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "yt-dlp>=2024.1.0",
    "questionary>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/Syqmhmmd-commits/vdl"
Repository = "https://github.com/Syqmhmmd-commits/vdl"
Issues = "https://github.com/Syqmhmmd-commits/vdl/issues"

[project.scripts]
vdl = "downloader.cli:main"

[tool.setuptools.packages.find]
include = ["downloader*"]

[tool.ruff]
line-length = 100
target-version = "py310"
