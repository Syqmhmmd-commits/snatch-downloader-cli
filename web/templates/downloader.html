{% extends "base.html" %}
{% block title %}Downloader — vdl{% endblock %}

{% block content %}
<div class="tool-page">
  <h1 class="tool-title">Video Downloader</h1>
  <p class="tool-sub">Paste URL, pilih resolusi, klik download.</p>

  <form id="form-check" class="card">
    <div class="field">
      <label for="url">URL Video</label>
      <div class="input-group">
        <input type="url" id="url" name="url" placeholder="https://..." required autofocus
               autocomplete="off" autocorrect="off" autocapitalize="off"
               spellcheck="false" data-form-type="other">
        <button type="submit" id="checkBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <span>Cek</span>
        </button>
      </div>
    </div>
  </form>

  <div id="preview" class="card preview hidden">
    <div class="preview-header">
      <img id="preview-thumb" class="preview-thumb" alt="">
      <div class="preview-info">
        <h3 id="preview-title"></h3>
        <p class="preview-meta">
          <span id="preview-uploader"></span>
          <span class="dot">·</span>
          <span id="preview-duration"></span>
          <span class="dot">·</span>
          <span id="preview-extractor"></span>
        </p>
      </div>
    </div>

    <div class="picker-section">
      <div class="picker-header">
        <label class="picker-label">Pilih Kualitas</label>
        <span class="auto-badge">⚡ Auto</span>
      </div>
      <div class="resolution-grid" id="resolution-grid"></div>
      <p class="picker-hint">
        Resolusi ≤720p dikirim langsung ke device kamu. Resolusi lebih tinggi diproses di server dulu.
      </p>
    </div>

    <div class="selected-info hidden" id="selected-info">
      <div class="selected-row">
        <div class="selected-check">✓</div>
        <div>
          <div class="selected-title" id="selected-title">—</div>
          <div class="selected-size" id="selected-size">—</div>
        </div>
      </div>
    </div>

    <label class="checkbox">
      <input type="checkbox" name="audio_only" id="audio-only-toggle" value="true">
      <span>Hanya audio (MP3)</span>
    </label>

    <button type="button" id="submitBtn" disabled>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      <span id="submitLabel">Pilih kualitas dulu</span>
    </button>
  </div>

  <div id="status" class="status hidden"></div>
</div>

<script>
const formCheck = document.getElementById('form-check');
const preview = document.getElementById('preview');
const status = document.getElementById('status');
const checkBtn = document.getElementById('checkBtn');
const submitBtn = document.getElementById('submitBtn');
const submitLabel = document.getElementById('submitLabel');
const resolutionGrid = document.getElementById('resolution-grid');
const selectedInfo = document.getElementById('selected-info');
const selectedTitle = document.getElementById('selected-title');
const selectedSize = document.getElementById('selected-size');
const audioOnlyToggle = document.getElementById('audio-only-toggle');

let currentUrl = '';
let currentFormats = [];
let selectedFormat = null;

const CODEC_PRIORITY = { 'H.264': 0, 'VP9': 1, 'AV1': 2 };
const STREAM_MAX_HEIGHT = 720;

function hasSize(f) {
  return f.filesize_str && f.filesize_str !== '?' && f.filesize;
}

formCheck.addEventListener('submit', async (e) => {
  e.preventDefault();
  checkBtn.disabled = true;
  status.classList.remove('hidden', 'error', 'success');
  status.innerHTML = '<span class="spinner"></span> Mengambil info video...';
  preview.classList.add('hidden');

  const fd = new FormData(formCheck);
  try {
    const res = await fetch('/api/info', { method: 'POST', body: fd });
    const data = await res.json();
    if (!data.ok) {
      status.classList.add('error');
      status.textContent = '✗ ' + data.error;
      checkBtn.disabled = false;
      return;
    }
    status.classList.add('hidden');
    currentUrl = fd.get('url');
    currentFormats = data.formats || [];

    document.getElementById('preview-thumb').src = data.thumbnail || '';
    document.getElementById('preview-title').textContent = data.title || 'Tanpa judul';
    document.getElementById('preview-uploader').textContent = data.uploader || '-';
    document.getElementById('preview-duration').textContent = data.duration_str || '-';
    document.getElementById('preview-extractor').textContent = data.extractor || '-';

    selectedFormat = null;
    selectedInfo.classList.add('hidden');
    submitBtn.disabled = true;
    submitLabel.textContent = 'Pilih kualitas dulu';

    renderResolutionGrid();
    preview.classList.remove('hidden');
    checkBtn.disabled = false;
    preview.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  } catch (err) {
    status.classList.add('error');
    status.textContent = 'Request error: ' + err.message;
    checkBtn.disabled = false;
  }
});

function renderResolutionGrid() {
  const byHeight = {};
  currentFormats.forEach(f => {
    if (!byHeight[f.height]) byHeight[f.height] = [];
    byHeight[f.height].push(f);
  });

  const heights = Object.keys(byHeight).map(Number).sort((a, b) => b - a);

  resolutionGrid.innerHTML = '';
  heights.forEach((h, idx) => {
    const variants = byHeight[h];
    const best = variants.sort((a, b) =>
      (CODEC_PRIORITY[a.codec_label] ?? 9) - (CODEC_PRIORITY[b.codec_label] ?? 9)
    )[0];

    const sizeAvailable = hasSize(best);
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'resolution-btn' + (sizeAvailable ? '' : ' no-size');
    btn.dataset.height = h;

    if (sizeAvailable) {
      btn.innerHTML = `
        <span class="res-label">${h}p</span>
        <span class="res-size">~${best.filesize_str}</span>
      `;
    } else {
      btn.innerHTML = `<span class="res-label">${h}p</span>`;
    }

    btn.addEventListener('click', () => onSelectResolution(h, best));
    resolutionGrid.appendChild(btn);

    if (idx === 0) {
      setTimeout(() => onSelectResolution(h, best), 50);
    }
  });
}

function onSelectResolution(height, format) {
  selectedFormat = format;
  document.querySelectorAll('.resolution-btn').forEach(b => {
    b.classList.toggle('active', Number(b.dataset.height) === height);
  });

  const codecText = format.codec_label !== '?' ? ` · ${format.codec_label}` : '';
  selectedTitle.textContent = `${format.height}p${codecText}`;

  if (hasSize(format)) {
    selectedSize.textContent = `Estimasi ukuran: ~${format.filesize_str}`;
    selectedSize.classList.remove('empty');
  } else {
    selectedSize.textContent = 'Ukuran file tidak tersedia dari platform ini';
    selectedSize.classList.add('empty');
  }

  selectedInfo.classList.remove('hidden');
  submitBtn.disabled = false;
  submitLabel.textContent = 'Download';
}

audioOnlyToggle.addEventListener('change', () => {
  if (audioOnlyToggle.checked) {
    document.querySelectorAll('.resolution-btn').forEach(b => b.classList.remove('active'));
    selectedInfo.classList.add('hidden');
    submitBtn.disabled = false;
    submitLabel.textContent = 'Download MP3';
  } else if (selectedFormat) {
    onSelectResolution(selectedFormat.height, selectedFormat);
  } else {
    submitBtn.disabled = true;
    submitLabel.textContent = 'Pilih kualitas dulu';
  }
});

submitBtn.addEventListener('click', async () => {
  const audioOnly = audioOnlyToggle.checked;

  if (!audioOnly && !selectedFormat) {
    status.classList.remove('hidden');
    status.classList.add('error');
    status.textContent = 'Pilih kualitas dulu.';
    return;
  }

  // Streaming untuk ≤720p
  if (!audioOnly && selectedFormat.height <= STREAM_MAX_HEIGHT) {
    const streamUrl = `/api/stream?url=${encodeURIComponent(currentUrl)}&quality=${selectedFormat.height}`;
    status.classList.remove('hidden', 'error', 'success');
    status.classList.add('success');
    status.innerHTML = `
      <div style="margin-bottom: 8px;">
        <strong>⚡ Streaming ke device pribadi</strong>
      </div>
      <div style="font-size: 0.85em; opacity: 0.85; margin-bottom: 12px;">
        Download berjalan di browser kamu. Cek progress di menu Download browser.
      </div>
      <a href="${streamUrl}" class="btn-download-file" download>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Mulai Streaming
      </a>
    `;
    setTimeout(() => {
      const a = document.createElement('a');
      a.href = streamUrl;
      a.download = 'video.mp4';
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }, 100);
    return;
  }

  // Server download untuk >720p atau audio
  submitBtn.disabled = true;
  status.classList.remove('hidden', 'error', 'success');
  status.innerHTML = '<span class="spinner"></span> Memproses di server...';

  const fd = new FormData();
  fd.append('url', currentUrl);
  fd.append('quality', audioOnly ? 'best' : String(selectedFormat.height));
  if (audioOnly) fd.append('audio_only', 'true');

  try {
    const res = await fetch('/api/download', { method: 'POST', body: fd });
    const data = await res.json();
    if (!data.ok) {
      status.classList.add('error');
      status.textContent = data.error;
      submitBtn.disabled = false;
      return;
    }
    const jobId = data.job_id;
    let autoTriggered = false;

    const interval = setInterval(async () => {
      try {
        const r = await fetch(`/api/job/${jobId}`);
        const j = await r.json();

        if (j.status === 'done') {
          clearInterval(interval);

          if (!autoTriggered) {
            autoTriggered = true;
            status.classList.add('success');
            const filename = j.filename || 'video.mp4';
            const filesize = j.filesize_str ? ` (${j.filesize_str})` : '';
            status.innerHTML = `
              <div style="margin-bottom: 8px;">
                <strong>✓ Download selesai</strong>${filesize}
              </div>
              <div style="font-size: 0.85em; opacity: 0.85;">
                Memulai pengiriman ke device pribadi kamu...
              </div>
            `;
            const a = document.createElement('a');
            a.href = `/api/file/${jobId}`;
            a.download = filename;
            a.style.display = 'none';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            setTimeout(() => {
              status.innerHTML = `
                <div style="margin-bottom: 8px;">
                  <strong>✓ File dikirim ke device pribadi</strong>
                </div>
                <div style="font-size: 0.85em; opacity: 0.75; margin-bottom: 12px;">
                  Cek folder Download di device kamu.
                </div>
                <a href="/api/file/${jobId}" download class="btn-download-file">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="7 10 12 15 17 10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>
                  </svg>
                  Kirim Ulang ke Device
                </a>
              `;
            }, 3000);
          }

          submitBtn.disabled = false;
          submitLabel.textContent = 'Download';
        } else if (j.status === 'error') {
          clearInterval(interval);
          status.classList.add('error');
          status.textContent = '✗ ' + j.error;
          submitBtn.disabled = false;
          submitLabel.textContent = 'Download';
        } else {
          const pct = (j.progress || 0).toFixed(1);
          const label = j.status === 'processing' ? 'Processing...' :
                        j.status === 'starting'   ? 'Starting...' :
                        j.status === 'queued'     ? 'Queued' :
                                                    'Downloading';
          status.innerHTML = `
            <div class="progress-info"><span>${label}</span><span>${pct}%</span></div>
            <div class="progress-bar"><div class="progress-fill" style="width: ${pct}%"></div></div>
          `;
        }
      } catch (err) {
        clearInterval(interval);
        status.classList.add('error');
        status.textContent = 'Polling error: ' + err.message;
        submitBtn.disabled = false;
        submitLabel.textContent = 'Download';
      }
    }, 500);
  } catch (err) {
    status.classList.add('error');
    status.textContent = 'Request error: ' + err.message;
    submitBtn.disabled = false;
    submitLabel.textContent = 'Download';
  }
});
</script>
{% endblock %}
